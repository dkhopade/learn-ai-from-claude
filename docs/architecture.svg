    <marker id="arrowRed" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#C74634"/>
    </marker>
  </defs>

  <line x1="480" y1="204" x2="480" y2="228" stroke="#65605C" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M405,262 C330,262 250,300 210,348" fill="none" stroke="#65605C" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="280" y1="383" x2="398" y2="383" stroke="#65605C" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M400,405 C330,430 250,445 195,468" fill="none" stroke="#65605C" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="460" y1="418" x2="405" y2="468" stroke="#65605C" stroke-width="1.4" marker-end="url(#arrow)"/>
  <path d="M520,418 C550,435 570,450 585,468" fill="none" stroke="#65605C" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="718" y1="383" x2="562" y2="383" stroke="#C74634" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#arrowRed)"/>
  <line x1="795" y1="468" x2="795" y2="418" stroke="#C74634" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#arrowRed)"/>

  <text x="72" y="582" font-size="9" fill="#8A8580">Solid = request flow    ·    Dashed red = CI/CD image build &amp; pull</text>
</svg>
