  <text x="480" y="393" text-anchor="middle" font-size="10" fill="#65605C">FastAPI · RAG + Agent</text>
  <text x="480" y="407" text-anchor="middle" font-size="9" fill="#8A8580">2 replicas · CPU pool</text>

  <rect x="110" y="470" width="150" height="72" rx="8" fill="#ffffff" stroke="#7D57C1" stroke-width="1.5"/>
  <rect x="110" y="470" width="6" height="72" rx="3" fill="#7D57C1"/>
