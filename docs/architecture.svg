  <text x="200" y="407" text-anchor="middle" font-size="9" fill="#8A8580">2 replicas · CPU pool</text>

  <rect x="400" y="350" width="160" height="66" rx="8" fill="#ffffff" stroke="#C74634" stroke-width="1.5"/>
  <rect x="400" y="350" width="6" height="66" rx="3" fill="#C74634"/>
