# LLM Gateway — routing, caching, rate limiting, metrics.
# Runs on CPU nodes; scraped by Prometheus via annotations.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-gateway
  labels:
    app: ai-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-gateway
  template:
    metadata:
      labels:
        app: ai-gateway
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: gateway
          image: iad.ocir.io/idb8ulrkkzqx/learn-ai/ai-gateway:latest
          ports:
            - containerPort: 8080
          env:
            - name: VLLM_URL
              value: "http://vllm.default.svc:8000"
            - name: RATE_LIMIT_RPS
              value: "2"
            - name: RATE_LIMIT_BURST
              value: "5"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
      imagePullSecrets:
        - name: ocir-secret
---
apiVersion: v1
kind: Service
metadata:
  name: ai-gateway
spec:
  selector:
    app: ai-gateway
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP
